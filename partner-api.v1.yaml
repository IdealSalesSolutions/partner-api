  /v1/applications/{applicationId}/fulfil:
    post:
      operationId: fulfilApplication
      security:
        - partnerApiKey:
            - applications:amend
      summary: Request fulfilment.
      description: "Tells Ideal the customer has received what they financed, which is what allows the
        finance to be paid out. Calling this is the only way to start fulfilment: nothing fulfils an
        application automatically. The request is accepted with 202 and the application stays signed
        until the lender acknowledges it; it then moves to fulfilled, and your webhook receives
        application.status_changed from signed to fulfilled. Only an accepted request (202) binds
        its Idempotency-Key: a retry with the same key then always answers that original 202,
        whatever the application's state is now. A refused request (404 or 409) stores nothing, so
        the same key can be used again once the application is ready, and that call gets a fresh
        answer. While a request is pending, another call with a new key answers 202 with the same
        state and starts nothing new. Not yet available: this operation currently answers 501."
      tags:
        - applications
      x-codeSamples:
        - lang: curl
          label: curl
          source: |-
            curl -X POST 'https://api.example.invalid/partner/v1/applications/5f0c7d2e-8a41-4c3b-9e6f-2d1a7b9c4e10/fulfil' \
              -H "Authorization: Bearer $PARTNER_API_KEY" \
              -H 'Idempotency-Key: PB-104231-fulfil-1'
        - lang: JavaScript
          label: Node (fetch)
          source: |-
            const res = await fetch("https://api.example.invalid/partner/v1/applications/5f0c7d2e-8a41-4c3b-9e6f-2d1a7b9c4e10/fulfil", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.PARTNER_API_KEY}`,
                "Idempotency-Key": "PB-104231-fulfil-1",
              },
            });
            const answer = await res.json(); // application/json, or application/problem+json on an error
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: "A key you choose for this fulfilment request. Only an accepted request (202) binds the
              key: a retry with the same key then answers that original 202 again, whatever the
              application's state is now, and starts nothing new. A refused request (404 or 409)
              stores nothing, so the same key can be used again once the application is ready and
              gets a fresh answer. A key bound by a 202 for a different application of yours is
              refused with 409 idempotency_key_conflict."
          required: true
          description: "A key you choose for this fulfilment request. Only an accepted request (202) binds the
            key: a retry with the same key then answers that original 202 again, whatever the
            application's state is now, and starts nothing new. A refused request (404 or 409)
            stores nothing, so the same key can be used again once the application is ready and gets
            a fresh answer. A key bound by a 202 for a different application of yours is refused
            with 409 idempotency_key_conflict."
          name: Idempotency-Key
          in: header
      responses:
        "202":
          description: "Fulfilment requested. The application is still signed; it becomes fulfilled when the
            lender acknowledges, signalled by your webhook. This response binds the Idempotency-Key:
            a retry with the same key gets this original response again, even once the application
            has moved on."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: The request does not match the contract.
          content:
            application/problem+json:
              examples:
                noIdempotencyKey:
                  summary: No Idempotency-Key
                  value:
                    type: about:blank
                    title: The request does not match the contract
                    status: 400
                    code: bad_request
                    detail: "header.Idempotency-Key: Invalid input: expected string, received undefined"
                badId:
                  summary: An application id that is not a UUID
                  value:
                    type: about:blank
                    title: The request does not match the contract
                    status: 400
                    code: bad_request
                    detail: "param.applicationId: Invalid UUID"
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "insufficient_scope: the key is valid but lacks a scope this request needs, named in
            detail. Nothing was written."
          content:
            application/problem+json:
              examples:
                missingScope:
                  summary: A key without applications:amend
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: insufficient_scope
                    detail: fulfilApplication needs a key with applications:amend.
              schema:
                $ref: "#/components/schemas/ScopeProblem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "invalid_state when the application isn't signed and no earlier 202 for it bound the
            Idempotency-Key; idempotency_key_conflict when the Idempotency-Key is bound by a 202 for
            a different application of yours. A 409 stores nothing: the key stays unbound, and a
            later call with it gets a fresh answer."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/FulfilConflictProblem"
        "501":
          description: Not yet available.
          content:
            application/problem+json:
              examples:
                notImplemented:
                  summary: Not yet available
                  value:
                    type: about:blank
                    title: fulfilApplication is not implemented
                    status: 501
                    code: not_implemented
              schema:
                $ref: "#/components/schemas/NotImplementedProblem"
webhooks:
  applicationEvent:
    post:
      operationId: applicationEventWebhook
      summary: Sent to the partner's webhook URL. HMAC-signed.
      description: "Ideal POSTs each event to the https webhook URL your partner_admin registers in the
        partner admin. Each delivery is signed: X-Signature is `t=<unix seconds>,v1=<hex>`, where v1
        is HMAC-SHA256 keyed with your webhook secret (the whole string shown, whsec_ included, as
        UTF-8 bytes) over the string `<t>.<raw body>`, in lowercase hex. To verify: take the raw
        request bytes before parsing, compute the HMAC over t, a full stop and those bytes, compare
        it with each v1 in constant time, and accept the delivery only if one matches and t is at
        most 5 minutes old. The webhook secret is your partner's own, shown once to a partner_admin
        in the partner admin, and can be rotated there. For 24 hours after a rotation the header
        carries two v1 entries, one per secret, so you can switch secrets without missing a
        delivery. A delivery that does not answer 2XX within 10 seconds is retried with growing gaps
        for 24 hours, then marked failed and Ideal's operations team is alerted; read the
        application with getApplication to catch up, and Ideal can replay any event. Redirects are
        not followed. Events for one application arrive in the order they happened, each after the
        one before it has been delivered or has failed; events for different applications arrive
        independently. Every retry and replay carries the same eventId."
      security: []
      tags:
        - webhooks
      parameters:
        - schema:
            type: string
            description: t=<unix seconds>,v1=<HMAC-SHA256 of "<t>.<raw body>" keyed with your webhook secret,
              lowercase hex>, with a second v1 for 24 hours after a rotation. The examples are
              signed with the example secret whsec_example_do_not_use over each example body's
              compact JSON.
          required: true
          description: t=<unix seconds>,v1=<HMAC-SHA256 of "<t>.<raw body>" keyed with your webhook secret,
            lowercase hex>, with a second v1 for 24 hours after a rotation. The examples are signed
            with the example secret whsec_example_do_not_use over each example body's compact JSON.
          examples:
            statusChanged:
              summary: application.status_changed
              value: t=1791798067,v1=5cd52388091b18ca49ccffe17dd8d15475426045c29dcf9bd45ea48d1bebef53
            amended:
              summary: application.amended
              value: t=1791799364,v1=33281152afbfde5625cdc9ef277c0f1090d479b0888569892d6b483c8d950e60
          name: X-Signature
          in: header
      requestBody:
        required: true
        content:
          application/json:
            examples:
              statusChanged:
                summary: application.status_changed
                value:
                  eventId: 0b6f3c1e-7d2a-4f58-9c41-3e8a5d2b7f90
                  type: application.status_changed
                  occurredAt: 2026-10-12T09:41:07.000Z
                  applicationId: 5f0c7d2e-8a41-4c3b-9e6f-2d1a7b9c4e10
                  partnerReference: PB-104231
                  from: created
                  to: in_progress
              amended:
                summary: application.amended
                value:
                  eventId: 8e2d4a6b-1c3f-4e7a-b5d9-0f2c6a8e4b13
                  type: application.amended
                  occurredAt: 2026-10-12T10:02:44.000Z
                  applicationId: 5f0c7d2e-8a41-4c3b-9e6f-2d1a7b9c4e10
                  partnerReference: PB-104231
                  quote:
                    total:
                      amountVatExclusive:
                        amount: 114900
                        currency: GBP
                      amountVat:
                        amount: 22980
                        currency: GBP
                      amountVatInclusive:
                        amount: 137880
                        currency: GBP
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        2XX:
          description: Acknowledged.
components:
  securitySchemes:
    partnerApiKey:
      type: http
      scheme: bearer
      description: "A partner API key as a bearer token. Each operation names the scope it needs:
        applications:create, applications:read or applications:amend."
  schemas:
    WebhookEvent:
      oneOf:
        - $ref: "#/components/schemas/StatusChangedEvent"
        - $ref: "#/components/schemas/AmendedEvent"
      discriminator:
        propertyName: type
        mapping:
          application.status_changed: "#/components/schemas/StatusChangedEvent"
          application.amended: "#/components/schemas/AmendedEvent"
      title: WebhookEvent
    StatusChangedEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: "This event's own id. It is the same on every retry and replay of the event: use it to
            de-duplicate."
        type:
          type: string
          const: application.status_changed
        occurredAt:
          type: string
          format: date-time
        applicationId:
          type: string
          format: uuid
          description: Ideal's Application id, the id createApplication returned. Never a lender's reference.
        partnerReference:
          type: string
        from:
          $ref: "#/components/schemas/Status"
        to:
          $ref: "#/components/schemas/Status"
      required:
        - eventId
        - type
        - occurredAt
        - applicationId
        - partnerReference
        - from
        - to
      title: StatusChangedEvent
      description: "Status can move backwards, always to in_progress: on an amend (from submitted or
        approved), when Ideal returns a submitted application to the customer, and when an approved
        offer lapses."
    Status:
      type: string
      title: ApplicationStatus
      description: "referred: the lender is looking more closely before it decides; approved, declined or
        expired follows. A customer who leaves the lender's site before finishing returns the
        application from submitted, referred or approved to in_progress, to submit again; only the
        customer, the partner or Ideal cancels it."
      enum:
        - created
        - in_progress
        - submitted
        - approved
        - declined
        - referred
        - signed
        - fulfilled
        - paid_out
        - withdrawn
        - cancelled
        - expired
    AmendedEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: "This event's own id. It is the same on every retry and replay of the event: use it to
            de-duplicate."
        type:
          type: string
          const: application.amended
        occurredAt:
          type: string
          format: date-time
        applicationId:
          type: string
          format: uuid
          description: Ideal's Application id, the id createApplication returned. Never a lender's reference.
        partnerReference:
          type: string
        quote:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/QuoteTotal"
          required:
            - total
      required:
        - eventId
        - type
        - occurredAt
        - applicationId
        - partnerReference
        - quote
      title: AmendedEvent
      description: The Quote was replaced. Its items are read with getApplication.
    QuoteTotal:
      type: object
      properties:
        amountVatExclusive:
          $ref: "#/components/schemas/Money"
        amountVat:
          $ref: "#/components/schemas/Money"
        amountVatInclusive:
          $ref: "#/components/schemas/Money"
      required:
        - amountVatExclusive
        - amountVat
        - amountVatInclusive
      title: QuoteTotal
      description: Computed by Ideal from the items. The amount financed is amountVatInclusive.
    Money:
      type: object
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: "In pence (minor units): 2345 = £23.45; at least 0, at most 1000000000 (£10,000,000.00)."
          example: 2345
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217. Only GBP is accepted for now; one currency per quote.
      required:
        - amount
        - currency
      title: Money
    CreatedApplication:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            handoffUrl:
              type: string
              format: uri
          required:
            - handoffUrl
      title: CreatedApplication
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partnerReference:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        customer:
          $ref: "#/components/schemas/Customer"
        property:
          $ref: "#/components/schemas/Property"
        quote:
          $ref: "#/components/schemas/Quote"
        timestamps:
          $ref: "#/components/schemas/Timestamps"
      required:
        - id
        - partnerReference
        - status
        - customer
        - property
        - quote
        - timestamps
      title: Application
    Customer:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/CustomerTitle"
        firstName:
          type: string
          minLength: 1
          maxLength: 255
        lastName:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        mobile:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
          description: E.164. Only UK mobiles (+447 and nine digits) are accepted for now.
          example: "+447700900123"
      required:
        - title
        - firstName
        - lastName
        - email
        - mobile
      title: Customer
    CustomerTitle:
      type: string
      title: CustomerTitle
      enum:
        - mr
        - mrs
        - miss
        - ms
        - mx
        - dr
        - other
    Property:
      type: object
      properties:
        flat:
          type:
            - string
            - "null"
        buildingName:
          type:
            - string
            - "null"
        buildingNumber:
          type:
            - string
            - "null"
        line1:
          type: string
        line2:
          type:
            - string
            - "null"
        line3:
          type:
            - string
            - "null"
        town:
          type: string
        county:
          type:
            - string
            - "null"
        postcode:
          type: string
        country:
          type: string
        uprn:
          type:
            - string
            - "null"
      required:
        - flat
        - buildingName
        - buildingNumber
        - line1
        - line2
        - line3
        - town
        - county
        - postcode
        - country
        - uprn
      title: Property
    Quote:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        total:
          $ref: "#/components/schemas/QuoteTotal"
        createdAt:
          type: string
          format: date-time
      required:
        - items
        - total
        - createdAt
      title: Quote
      description: The Quote in force; replaced ones are not shown.
    QuoteItem:
      type: object
      properties:
        title:
          type: string
        description:
          type:
            - string
            - "null"
        quantity:
          type: integer
          description: "100 = one item. In hundredths: 100 = 1.00 (the default), 150 = 1.50, 2345 = 23.45.
            From 1 (0.01) to 100000 (1000.00)."
          example: 100
        unitPrice:
          $ref: "#/components/schemas/Money"
        discount:
          anyOf:
            - $ref: "#/components/schemas/Discount"
            - type: "null"
          description: null when the line has no discount.
        vatRate:
          type: string
          description: A VatRate; more rates may be added.
        vat:
          $ref: "#/components/schemas/Money"
        net:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: quantity × unitPrice less the discount, excluding VAT.
      required:
        - title
        - description
        - quantity
        - unitPrice
        - discount
        - vatRate
        - vat
        - net
      title: QuoteItem
    Discount:
      oneOf:
        - $ref: "#/components/schemas/AmountDiscount"
        - $ref: "#/components/schemas/PercentageDiscount"
      title: Discount
      description: On the line's quantity × unitPrice; at most that amount. Leave it out of a request for
        no discount.
      discriminator:
        propertyName: type
        mapping:
          amount: "#/components/schemas/AmountDiscount"
          percentage: "#/components/schemas/PercentageDiscount"
    AmountDiscount:
      type: object
      properties:
        type:
          type: string
          const: amount
        amount:
          $ref: "#/components/schemas/Money"
      required:
        - type
        - amount
      title: Amount discount
      description: A fixed amount off this line, in pence.
    PercentageDiscount:
      type: object
      properties:
        type:
          type: string
          const: percentage
        percentage:
          type: integer
          minimum: 1
          maximum: 10000
          description: "In hundredths of a percent: 1000 = 10.00%. From 1 (0.01%) to 10000 (100.00%)."
          example: 1000
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: Your discount amount, checked within 1p of ours.
      required:
        - type
        - percentage
        - amount
      title: Percentage discount
      description: A percentage off this line, in hundredths of a percent, plus your amount for our 1p check.
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the status, the Quote or what you sent last changed.
        statusChangedAt:
          type: string
          format: date-time
        fulfilledAt:
          type:
            - string
            - "null"
          format: date-time
        paidOutAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - createdAt
        - updatedAt
        - statusChangedAt
        - fulfilledAt
        - paidOutAt
      title: Timestamps
      description: UTC, with milliseconds.
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - not_found
            - email_conflict
            - invalid_state
            - product_unavailable
            - amount_out_of_bounds
      required:
        - type
        - title
        - status
        - code
      title: Problem
    ScopeProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
          const: 403
        detail:
          type: string
        code:
          type: string
          const: insufficient_scope
      required:
        - type
        - title
        - status
        - code
      title: ScopeProblem
    QuoteProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - product_unavailable
            - amount_out_of_bounds
            - currency_mismatch
            - invalid_line_item
            - total_out_of_range
            - total_mismatch
        totals:
          allOf:
            - $ref: "#/components/schemas/QuoteTotal"
            - description: "With total_mismatch: our totals, computed from your items."
      required:
        - type
        - title
        - status
        - code
      title: QuoteProblem
    CreateApplicationRequest:
      type: object
      properties:
        partnerReference:
          type: string
          minLength: 1
          maxLength: 128
        customer:
          $ref: "#/components/schemas/Customer"
        property:
          $ref: "#/components/schemas/PropertyRequest"
        quote:
          $ref: "#/components/schemas/QuoteRequest"
      required:
        - partnerReference
        - customer
        - property
        - quote
      title: CreateApplicationRequest
    PropertyRequest:
      type: object
      properties:
        flat:
          type:
            - string
            - "null"
          maxLength: 255
        buildingName:
          type:
            - string
            - "null"
          maxLength: 255
        buildingNumber:
          type:
            - string
            - "null"
          maxLength: 255
        line1:
          type: string
          minLength: 1
          maxLength: 255
        line2:
          type:
            - string
            - "null"
          maxLength: 255
        line3:
          type:
            - string
            - "null"
          maxLength: 255
        town:
          type: string
          minLength: 1
          maxLength: 255
        county:
          type:
            - string
            - "null"
          maxLength: 255
        postcode:
          type: string
          minLength: 1
          maxLength: 16
          description: "A UK postcode, in any case and with or without its space: stored upper case with one
            space."
          example: YO1 7HH
        country:
          type: string
          description: ISO 3166-1 alpha-2. Only GB is accepted for now.
          example: GB
          const: GB
        uprn:
          type:
            - string
            - "null"
          pattern: ^[0-9]{1,12}$
      required:
        - line1
        - town
        - postcode
        - country
      title: PropertyRequest
    QuoteRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItemRequest"
          minItems: 1
          maxItems: 50
        expectedTotal:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: Your total including VAT. A difference from ours is refused with total_mismatch.
      required:
        - items
        - expectedTotal
      title: QuoteRequest
    QuoteItemRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - "null"
          maxLength: 4000
          description: Plain text. Line breaks are kept and a line starting "- " shows as a bullet; nothing
            else is interpreted.
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 100
          description: "100 = one item. In hundredths: 100 = 1.00 (the default), 150 = 1.50, 2345 = 23.45.
            From 1 (0.01) to 100000 (1000.00)."
          example: 100
        unitPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: Excluding VAT, at least 0.
        discount:
          $ref: "#/components/schemas/Discount"
        vatRate:
          $ref: "#/components/schemas/VatRate"
        vat:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: The line's VAT on its discounted net, within 1p of ours; 0 when exempt or 0%.
      required:
        - title
        - unitPrice
        - vatRate
        - vat
      title: QuoteItemRequest
    VatRate:
      type: string
      title: VatRate
      enum:
        - exempt
        - 0%
        - 5%
        - 20%
    NotImplementedProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
          const: 501
        code:
          type: string
          const: not_implemented
      required:
        - type
        - title
        - status
        - code
      title: NotImplementedProblem
    AmendApplicationRequest:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/QuoteRequest"
      required:
        - quote
      title: AmendApplicationRequest
    Handoff:
      type: object
      properties:
        handoffUrl:
          type: string
          format: uri
          description: "Single use: send the customer here once."
        expiresAt:
          type: string
          format: date-time
      required:
        - handoffUrl
        - expiresAt
      title: Handoff
    FulfilConflictProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - invalid_state
            - idempotency_key_conflict
      required:
        - type
        - title
        - status
        - code
      title: FulfilConflictProblem
  parameters:
    ApplicationId:
      schema:
        type: string
        format: uuid
      required: true
      name: applicationId
      in: path
  responses:
    Unauthorized:
      description: Missing or invalid partner API key.
      content:
        application/problem+json:
          examples:
            unauthorized:
              summary: Missing, wrong or revoked key, or one used from outside its IP ranges
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          examples:
            notFound:
              summary: No application of yours with this id or reference
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: not_found
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: email_conflict when the partnerReference belongs to a different customer email;
        invalid_state when the application has ended, or when the quote changes and the application
        is not created or in progress.
      content:
        application/problem+json:
          examples:
            emailConflict:
              summary: The partnerReference belongs to another customer
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: email_conflict
                detail: This partnerReference belongs to a different customer.
            ended:
              summary: The application has ended
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: invalid_state
                detail: The application has ended.
            quoteLocked:
              summary: A changed quote once the application is submitted
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: invalid_state
                detail: The quote can only change while the application is created or in progress.
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: "The quote is refused: currency_mismatch (not GBP, or not one currency),
        invalid_line_item (detail names the item and the rule), total_out_of_range (our total
        including VAT is not above zero, or is over 1000000000, £10,000,000.00), total_mismatch
        (expectedTotal differs from ours; totals carries ours), product_unavailable (no finance
        product is offered for a new or changed quote now), or amount_out_of_bounds (the total
        including VAT is outside every offered product's loan amounts)."
      content:
        application/problem+json:
          examples:
            totalMismatch:
              summary: "total_mismatch: expectedTotal is not our total"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: total_mismatch
                detail: expectedTotal differs from our total including VAT; totals has ours.
                totals:
                  amountVatExclusive:
                    amount: 99900
                    currency: GBP
                  amountVat:
                    amount: 19980
                    currency: GBP
                  amountVatInclusive:
                    amount: 119880
                    currency: GBP
            invalidLineItem:
              summary: "invalid_line_item: VAT not within 1p of the rate"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: invalid_line_item
                detail: "quote.items[0]: vat must be within 1p of the rate on the discounted net, and 0 when exempt
                  or 0%"
            currencyMismatch:
              summary: "currency_mismatch: not GBP"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: currency_mismatch
                detail: Every amount must be in GBP.
            totalOutOfRange:
              summary: "total_out_of_range: nothing to finance"
              value:
                type: about:blank
