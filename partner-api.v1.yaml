# Generated from the partner API's routes by `make gen`. Do not edit.
openapi: 3.1.0
info:
  title: Partner API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
security:
  - partnerApiKey: []
tags:
  - name: applications
    description: Applications.
paths:
  /v1/applications/{applicationId}/amendments:
    post:
      operationId: amendApplication
      security:
        - partnerApiKey:
            - applications:amend
      summary: Add an Amount Revision.
      description: "Not yet available: this operation currently answers 501."
      tags:
        - applications
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Amount"
      responses:
        "201":
          description: A new Amount Revision was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "501":
          description: Not yet available.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotImplementedProblem"
  /v1/applications:
    post:
      operationId: createApplication
      security:
        - partnerApiKey:
            - applications:create
      tags:
        - applications
      summary: Create an Application, idempotent on partnerReference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "200":
          description: An Application already exists for this partnerReference and customer email. A changed
            amount or breakdown adds an Amount Revision (only while the application is created or in
            progress; otherwise the answer is 409 invalid_state). A changed name or property address
            is ignored. Each call returns a fresh handoffUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApplication"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      operationId: findApplicationByPartnerReference
      security:
        - partnerApiKey:
            - applications:read
      summary: Find an Application by the partner reference.
      tags:
        - applications
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: partnerReference
          in: query
      responses:
        "200":
          description: The Application with this partnerReference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/applications/{applicationId}/fulfil:
    post:
      operationId: fulfilApplication
      security:
        - partnerApiKey:
            - applications:amend
      summary: Confirm fulfilment.
      description: "Confirms the customer has received what they financed. Fulfilment is the step that
        allows the finance to be paid out. Call this only if you and Ideal have agreed that
        fulfilment waits for your confirmation; otherwise it happens automatically when the customer
        signs. Not yet available: this operation currently answers 501."
      tags:
        - applications
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Fulfilment confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The application isn't waiting for fulfilment confirmation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: Not yet available.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotImplementedProblem"
  /v1/applications/{applicationId}:
    get:
      operationId: getApplication
      security:
        - partnerApiKey:
            - applications:read
      summary: Get an Application.
      tags:
        - applications
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: The Application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
webhooks:
  applicationEvent:
    post:
      operationId: applicationEventWebhook
      summary: Sent to the partner's webhook URL. HMAC-signed.
      security: []
      parameters:
        - schema:
            type: string
          required: true
          name: X-Signature
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        2XX:
          description: Acknowledged.
components:
  securitySchemes:
    partnerApiKey:
      type: http
      scheme: bearer
      description: "A partner API key as a bearer token. Each operation names the scope it needs:
        applications:create, applications:read or applications:amend."
  schemas:
    WebhookEvent:
      oneOf:
        - $ref: "#/components/schemas/StatusChangedEvent"
        - $ref: "#/components/schemas/AmendedEvent"
      discriminator:
        propertyName: type
        mapping:
          application.status_changed: "#/components/schemas/StatusChangedEvent"
          application.amended: "#/components/schemas/AmendedEvent"
      title: WebhookEvent
    StatusChangedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Stable event id; replays reuse it.
        type:
          type: string
          const: application.status_changed
        occurredAt:
          type: string
          format: date-time
        applicationId:
          type: string
          format: uuid
        partnerReference:
          type: string
        from:
          $ref: "#/components/schemas/Status"
        to:
          $ref: "#/components/schemas/Status"
      required:
        - id
        - type
        - occurredAt
        - applicationId
        - partnerReference
        - from
        - to
      title: StatusChangedEvent
    Status:
      type: string
      title: ApplicationStatus
      enum:
        - created
        - in_progress
        - submitted
        - approved
        - declined
        - referred
        - signed
        - fulfilled
        - paid_out
        - withdrawn
        - cancelled
        - expired
    AmendedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: application.amended
        occurredAt:
          type: string
          format: date-time
        applicationId:
          type: string
          format: uuid
        partnerReference:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
      required:
        - id
        - type
        - occurredAt
        - applicationId
        - partnerReference
        - amount
      title: AmendedEvent
    Amount:
      type: object
      properties:
        totalPence:
          type: integer
          minimum: 1
          description: Integer pence.
        breakdown:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                minLength: 1
              pence:
                type: integer
                minimum: 0
            required:
              - label
              - pence
          minItems: 1
      required:
        - totalPence
        - breakdown
      title: Amount
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partnerReference:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        customer:
          $ref: "#/components/schemas/Customer"
        amount:
          $ref: "#/components/schemas/Amount"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fulfilledAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - partnerReference
        - status
        - customer
        - amount
        - createdAt
        - updatedAt
        - fulfilledAt
      title: Application
    Customer:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
      required:
        - name
        - email
      title: Customer
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - not_found
            - email_conflict
            - invalid_state
            - product_unavailable
            - amount_out_of_bounds
      required:
        - type
        - title
        - status
        - code
      title: Problem
    NotImplementedProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
          const: 501
        code:
          type: string
          const: not_implemented
      required:
        - type
        - title
        - status
        - code
      title: NotImplementedProblem
    CreatedApplication:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            handoffUrl:
              type: string
              format: uri
          required:
            - handoffUrl
      title: CreatedApplication
    CreateApplicationRequest:
      type: object
      properties:
        partnerReference:
          type: string
          minLength: 1
          maxLength: 128
        customer:
          $ref: "#/components/schemas/Customer"
        propertyAddress:
          $ref: "#/components/schemas/Address"
        amount:
          $ref: "#/components/schemas/Amount"
      required:
        - partnerReference
        - customer
        - propertyAddress
        - amount
      title: CreateApplicationRequest
    Address:
      type: object
      properties:
        line1:
          type: string
        line2:
          type:
            - string
            - "null"
        town:
          type: string
        postcode:
          type: string
      required:
        - line1
        - town
        - postcode
      title: Address
  parameters:
    ApplicationId:
      schema:
        type: string
        format: uuid
      required: true
      name: applicationId
      in: path
  responses:
    BadRequest:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid partner API key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: email_conflict when the partnerReference belongs to a different customer email;
        invalid_state when the amount changes once the application is past created or in progress.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: product_unavailable or amount_out_of_bounds.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
