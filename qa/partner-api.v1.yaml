                        currency: GBP
              test:
                summary: webhook.test (test only)
                value:
                  eventId: 5d1a7c3e-2b4f-4a6d-9e81-7c0f3b2a6d45
                  type: webhook.test
                  occurredAt: 2026-10-19T10:15:00.000Z
                  message: This is a test from Ideal, sent because a member of your team pressed Send test. It carries
                    no application or customer data.
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        2XX:
          description: Acknowledged.
components:
  securitySchemes:
    partnerApiKey:
      type: http
      scheme: bearer
      description: "A partner API key as a bearer token. Each operation names the scope it needs:
        applications:create, applications:read or applications:amend."
  schemas:
    WebhookEvent:
      oneOf:
        - $ref: "#/components/schemas/StatusChangedEvent"
        - $ref: "#/components/schemas/AmendedEvent"
        - $ref: "#/components/schemas/TestEvent"
      discriminator:
        propertyName: type
        mapping:
          application.status_changed: "#/components/schemas/StatusChangedEvent"
          application.amended: "#/components/schemas/AmendedEvent"
          webhook.test: "#/components/schemas/TestEvent"
      title: WebhookEvent
    StatusChangedEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: "This event's own id. It is the same on every retry and replay of the event: use it to
            de-duplicate."
        type:
          type: string
          const: application.status_changed
        occurredAt:
          type: string
          format: date-time
        applicationId:
          type: string
          format: uuid
          description: Ideal's Application id, the id createApplication returned. Never a lender's reference.
        partnerReference:
          type: string
        from:
          $ref: "#/components/schemas/Status"
        to:
          $ref: "#/components/schemas/Status"
      required:
        - eventId
        - type
        - occurredAt
        - applicationId
        - partnerReference
        - from
        - to
      title: StatusChangedEvent
      description: "Status can move backwards, always to in_progress: on an amend (from submitted or
        approved), when Ideal returns a submitted application to the customer, and when an approved
        offer lapses."
    Status:
      type: string
      title: ApplicationStatus
      description: "referred: the lender is looking more closely before it decides; approved, declined or
        expired follows (on QA, only under the tags in Testing on QA). A customer who leaves the
        lender's site before finishing returns the application from submitted, referred or approved
        to in_progress, to submit again; only the customer, the partner or Ideal cancels it."
      enum:
        - created
        - in_progress
        - submitted
        - approved
        - declined
        - referred
        - signed
        - fulfilled
        - paid_out
        - withdrawn
        - cancelled
        - expired
    AmendedEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: "This event's own id. It is the same on every retry and replay of the event: use it to
            de-duplicate."
        type:
          type: string
          const: application.amended
        occurredAt:
          type: string
          format: date-time
        applicationId:
          type: string
          format: uuid
          description: Ideal's Application id, the id createApplication returned. Never a lender's reference.
        partnerReference:
          type: string
        quote:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/QuoteTotal"
          required:
            - total
      required:
        - eventId
        - type
        - occurredAt
        - applicationId
        - partnerReference
        - quote
      title: AmendedEvent
      description: The Quote was replaced. Its items are read with getApplication.
    QuoteTotal:
      type: object
      properties:
        amountVatExclusive:
          $ref: "#/components/schemas/Money"
        amountVat:
          $ref: "#/components/schemas/Money"
        amountVatInclusive:
          $ref: "#/components/schemas/Money"
      required:
        - amountVatExclusive
        - amountVat
        - amountVatInclusive
      title: QuoteTotal
      description: Computed by Ideal from the items. The amount financed is amountVatInclusive.
    Money:
      type: object
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: "In pence (minor units): 2345 = £23.45; at least 0, at most 1000000000 (£10,000,000.00)."
          example: 2345
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217. Only GBP is accepted for now; one currency per quote.
      required:
        - amount
        - currency
      title: Money
    TestEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: "This test's own id. A test is sent once: it is never retried or replayed."
        type:
          type: string
          const: webhook.test
        occurredAt:
          type: string
          format: date-time
          description: When the test was asked for.
        message:
          type: string
          description: The same fixed sentence on every test.
      required:
        - eventId
        - type
        - occurredAt
        - message
      title: TestEvent
      description: "Test only: sent once, and only when a member of your team presses Send test beside
        your webhook URL in the partner admin, so you can check you receive webhooks and verify
        their signature. It is signed exactly as every other event, carries no application or
        customer, and is never retried or listed among your deliveries. Answer it as any other
        event; it changes nothing."
    CreatedApplication:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            handoffUrl:
              type: string
              format: uri
          required:
            - handoffUrl
      title: CreatedApplication
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partnerReference:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        customer:
          $ref: "#/components/schemas/Customer"
        property:
          $ref: "#/components/schemas/Property"
        quote:
          $ref: "#/components/schemas/Quote"
        timestamps:
          $ref: "#/components/schemas/Timestamps"
      required:
        - id
        - partnerReference
        - status
        - customer
        - property
        - quote
        - timestamps
      title: Application
    Customer:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/CustomerTitle"
        firstName:
          type: string
          minLength: 1
          maxLength: 255
        lastName:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        mobile:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
          description: E.164. Only UK mobiles (+447 and nine digits) are accepted for now.
          example: "+447700900123"
      required:
        - title
        - firstName
        - lastName
        - email
        - mobile
      title: Customer
    CustomerTitle:
      type: string
      title: CustomerTitle
      enum:
        - mr
        - mrs
        - miss
        - ms
        - mx
        - dr
        - other
    Property:
      type: object
      properties:
        flat:
          type:
            - string
            - "null"
        buildingName:
          type:
            - string
            - "null"
        buildingNumber:
          type:
            - string
            - "null"
        line1:
          type: string
        line2:
          type:
            - string
            - "null"
        line3:
          type:
            - string
            - "null"
        town:
          type: string
        county:
          type:
            - string
            - "null"
        postcode:
          type: string
        country:
          type: string
        uprn:
          type:
            - string
            - "null"
      required:
        - flat
        - buildingName
        - buildingNumber
        - line1
        - line2
        - line3
        - town
        - county
        - postcode
        - country
        - uprn
      title: Property
    Quote:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        total:
          $ref: "#/components/schemas/QuoteTotal"
        createdAt:
          type: string
          format: date-time
      required:
        - items
        - total
        - createdAt
      title: Quote
      description: The Quote in force; replaced ones are not shown.
    QuoteItem:
      type: object
      properties:
        title:
          type: string
        description:
          type:
            - string
            - "null"
        quantity:
          type: integer
          description: "100 = one item. In hundredths: 100 = 1.00 (the default), 150 = 1.50, 2345 = 23.45.
            From 1 (0.01) to 100000 (1000.00)."
          example: 100
        unitPrice:
          $ref: "#/components/schemas/Money"
        discount:
          anyOf:
            - $ref: "#/components/schemas/Discount"
            - type: "null"
          description: null when the line has no discount.
        vatRate:
          type: string
          description: A VatRate; more rates may be added.
        vat:
          $ref: "#/components/schemas/Money"
        net:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: quantity × unitPrice less the discount, excluding VAT.
      required:
        - title
        - description
        - quantity
        - unitPrice
        - discount
        - vatRate
        - vat
        - net
      title: QuoteItem
    Discount:
      oneOf:
        - $ref: "#/components/schemas/AmountDiscount"
        - $ref: "#/components/schemas/PercentageDiscount"
      title: Discount
      description: On the line's quantity × unitPrice; at most that amount. Leave it out of a request for
        no discount.
      discriminator:
        propertyName: type
        mapping:
          amount: "#/components/schemas/AmountDiscount"
          percentage: "#/components/schemas/PercentageDiscount"
    AmountDiscount:
      type: object
      properties:
        type:
          type: string
          const: amount
        amount:
          $ref: "#/components/schemas/Money"
      required:
        - type
        - amount
      title: Amount discount
      description: A fixed amount off this line, in pence.
    PercentageDiscount:
      type: object
      properties:
        type:
          type: string
          const: percentage
        percentage:
          type: integer
          minimum: 1
          maximum: 10000
          description: "In hundredths of a percent: 1000 = 10.00%. From 1 (0.01%) to 10000 (100.00%)."
          example: 1000
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: Your discount amount, checked within 1p of ours.
      required:
        - type
        - percentage
        - amount
      title: Percentage discount
      description: A percentage off this line, in hundredths of a percent, plus your amount for our 1p check.
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the status, the Quote or what you sent last changed.
        statusChangedAt:
          type: string
          format: date-time
        fulfilledAt:
          type:
            - string
            - "null"
          format: date-time
        paidOutAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - createdAt
        - updatedAt
        - statusChangedAt
        - fulfilledAt
        - paidOutAt
      title: Timestamps
      description: UTC, with milliseconds.
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - not_found
            - email_conflict
            - invalid_state
            - product_unavailable
            - amount_out_of_bounds
      required:
        - type
        - title
        - status
        - code
      title: Problem
    ScopeProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
          const: 403
        detail:
          type: string
        code:
          type: string
          const: insufficient_scope
      required:
        - type
        - title
        - status
        - code
      title: ScopeProblem
    CreateConflictProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - email_conflict
            - invalid_state
            - details_differ
      required:
        - type
        - title
        - status
        - code
      title: CreateConflictProblem
    QuoteProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - product_unavailable
            - amount_out_of_bounds
            - currency_mismatch
            - invalid_line_item
            - total_out_of_range
            - total_mismatch
        totals:
          allOf:
            - $ref: "#/components/schemas/QuoteTotal"
            - description: "With total_mismatch: our totals, computed from your items."
      required:
        - type
        - title
        - status
        - code
      title: QuoteProblem
    RateLimitedProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
          const: 429
        detail:
          type: string
        code:
          type: string
          const: rate_limited
      required:
        - type
        - title
        - status
        - code
      title: RateLimitedProblem
    CreateApplicationRequest:
      type: object
      properties:
        partnerReference:
          type: string
          minLength: 1
          maxLength: 128
        customer:
          $ref: "#/components/schemas/Customer"
        property:
          $ref: "#/components/schemas/PropertyRequest"
        quote:
          $ref: "#/components/schemas/QuoteRequest"
        optionId:
          type: string
          format: uuid
          description: A finance option's optionId from listFinanceOptions. The customer's journey opens on
            it, and they can still choose another. Taken only while the application is created and
            the customer has not chosen an option themselves; the option already chosen is always
            accepted, so a replay is safe, and another is refused with 409 invalid_state. It must be
            one of your options for this application's amount now, or the request is refused with
            422 product_unavailable naming optionId. Either way nothing is written.
          example: 3b8f2c1e-6d4a-4f7b-9a2e-5c1d8e7f6a90
      required:
        - partnerReference
        - customer
        - property
        - quote
      title: CreateApplicationRequest
    PropertyRequest:
      type: object
      properties:
        flat:
          type:
            - string
            - "null"
          maxLength: 255
        buildingName:
          type:
            - string
            - "null"
          maxLength: 255
        buildingNumber:
          type:
            - string
            - "null"
          maxLength: 255
        line1:
          type: string
          minLength: 1
          maxLength: 255
        line2:
          type:
            - string
            - "null"
          maxLength: 255
        line3:
          type:
            - string
            - "null"
          maxLength: 255
        town:
          type: string
          minLength: 1
          maxLength: 255
        county:
          type:
            - string
            - "null"
          maxLength: 255
        postcode:
          type: string
          minLength: 1
          maxLength: 16
          description: "A UK postcode, in any case and with or without its space: stored upper case with one
            space."
          example: YO1 7HH
        country:
          type: string
          description: ISO 3166-1 alpha-2. Only GB is accepted for now.
          example: GB
          const: GB
        uprn:
          type:
            - string
            - "null"
          pattern: ^[0-9]{1,12}$
      required:
        - line1
        - town
        - postcode
        - country
      title: PropertyRequest
    QuoteRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItemRequest"
          minItems: 1
          maxItems: 50
        expectedTotal:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: Your total including VAT. A difference from ours is refused with total_mismatch.
      required:
        - items
        - expectedTotal
      title: QuoteRequest
    QuoteItemRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - "null"
          maxLength: 4000
          description: Plain text. Line breaks are kept and a line starting "- " shows as a bullet; nothing
            else is interpreted.
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 100
          description: "100 = one item. In hundredths: 100 = 1.00 (the default), 150 = 1.50, 2345 = 23.45.
            From 1 (0.01) to 100000 (1000.00)."
          example: 100
        unitPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: Excluding VAT, at least 0.
        discount:
          $ref: "#/components/schemas/Discount"
        vatRate:
          $ref: "#/components/schemas/VatRate"
        vat:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: The line's VAT on its discounted net, within 1p of ours; 0 when exempt or 0%.
      required:
        - title
        - unitPrice
        - vatRate
        - vat
      title: QuoteItemRequest
    VatRate:
      type: string
      title: VatRate
      enum:
        - exempt
        - 0%
        - 5%
        - 20%
    NotImplementedProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
          const: 501
        code:
          type: string
          const: not_implemented
      required:
        - type
        - title
        - status
        - code
      title: NotImplementedProblem
    AmendApplicationRequest:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/QuoteRequest"
      required:
        - quote
      title: AmendApplicationRequest
    Handoff:
      type: object
      properties:
        handoffUrl:
          type: string
          format: uri
          description: "Single use: send the customer here once."
        expiresAt:
          type: string
          format: date-time
      required:
        - handoffUrl
        - expiresAt
      title: Handoff
    IssueHandoffRequest:
      type: object
      properties:
        optionId:
          type: string
          format: uuid
          description: A finance option's optionId from listFinanceOptions. The customer's journey opens on
            it, and they can still choose another. Taken only while the application is created and
            the customer has not chosen an option themselves; the option already chosen is always
            accepted, so a replay is safe, and another is refused with 409 invalid_state. It must be
            one of your options for this application's amount now, or the request is refused with
            422 product_unavailable naming optionId. Either way nothing is written.
          example: 3b8f2c1e-6d4a-4f7b-9a2e-5c1d8e7f6a90
      title: IssueHandoffRequest
    FulfilConflictProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - invalid_state
            - idempotency_key_conflict
      required:
        - type
        - title
        - status
        - code
      title: FulfilConflictProblem
    FinanceOptions:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceOption"
          description: In the order to show them. Empty when none of your options finances the amount, or none
            is offered now.
      required:
        - items
      title: FinanceOptions
    FinanceOption:
      type: object
      properties:
        optionId:
          type: string
          format: uuid
          description: Ours and opaque. Send it as optionId on createApplication or issueHandoff to open the
            customer's journey on this option. A change to the option's terms gives it a new
            optionId, so read the options again rather than keeping one.
        displayName:
          type: string
          description: "The option's name for the customer, from its shape alone: no rate, cost or lender.
            Show it as it is."
        type:
          $ref: "#/components/schemas/FinanceOptionType"
        termMonths:
          type: integer
          minimum: 1
          description: How many monthly payments.
        deferralMonths:
          type: integer
          minimum: 0
          description: Months with nothing to pay before the first payment; 0 for none.
        monthlyPayment:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: "Always null for now: only the lender can work out the payments (see Showing finance
            options at checkout)."
        totalPayable:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: "Always null for now: only the lender can work out the total (see Showing finance
            options at checkout)."
        minAmount:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: The least this option finances.
        maxAmount:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: The most this option finances.
      required:
        - optionId
        - displayName
        - type
        - termMonths
        - deferralMonths
        - monthlyPayment
        - totalPayable
        - minAmount
        - maxAmount
      title: FinanceOption
    FinanceOptionType:
      type: string
      title: FinanceOptionType
      description: "interest_free: no interest. interest_bearing: monthly payments with interest.
        deferred: nothing to pay for deferralMonths, then termMonths monthly payments. Not for
        showing as a statement about cost: see Showing finance options at checkout."
      enum:
        - interest_free
        - interest_bearing
        - deferred
  parameters:
    ApplicationId:
      schema:
        type: string
        format: uuid
      required: true
      name: applicationId
      in: path
  responses:
    Unauthorized:
      description: Missing or invalid partner API key.
      content:
        application/problem+json:
          examples:
            unauthorized:
              summary: Missing, wrong or revoked key, or one used from outside its IP ranges
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          examples:
            notFound:
              summary: No application of yours with this id or reference
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: not_found
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "email_conflict when the partnerReference belongs to a different customer email;
        details_differ when the customer's title, name or mobile, or the property, differs from what
        the first create sent (nothing is changed and no handoffUrl is issued: the customer corrects
        their own details in the journey, and issueHandoff gives a fresh handoffUrl); invalid_state
        when the application has ended, when the quote changes and the application is not created or
        in progress, or when the optionId changes once the application is past created or the
        customer has chosen."
      content:
        application/problem+json:
          examples:
            emailConflict:
              summary: The partnerReference belongs to another customer
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: email_conflict
                detail: This partnerReference belongs to a different customer.
            detailsDiffer:
              summary: Other customer or property details than the first create's
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: details_differ
                detail: The customer's title, name and mobile and the property are those the first create sent, and
                  only the customer corrects them, in the journey. Nothing was changed. For a fresh
                  handoffUrl, call issueHandoff.
            ended:
              summary: The application has ended
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: invalid_state
                detail: The application has ended.
            quoteLocked:
              summary: A changed quote once the application is submitted
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: invalid_state
                detail: The quote can only change while the application is created or in progress.
            optionLocked:
              summary: Another optionId once the customer has chosen or started
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: invalid_state
                detail: The finance option can only change while the application is created and the customer has not
                  chosen one.
          schema:
            $ref: "#/components/schemas/CreateConflictProblem"
    Unprocessable:
      description: "The quote is refused: currency_mismatch (not GBP, or not one currency),
        invalid_line_item (detail names the item and the rule), total_out_of_range (our total
        including VAT is not above zero, or is over 1000000000, £10,000,000.00), total_mismatch
        (expectedTotal differs from ours; totals carries ours), product_unavailable (no finance
        product is offered for a new or changed quote now), or amount_out_of_bounds (the total
        including VAT is outside every offered product's loan amounts). On createApplication,
        product_unavailable naming optionId also refuses an optionId that is not one of your options
        for the quote's total now."
      content:
        application/problem+json:
          examples:
            totalMismatch:
              summary: "total_mismatch: expectedTotal is not our total"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: total_mismatch
                detail: expectedTotal differs from our total including VAT; totals has ours.
                totals:
                  amountVatExclusive:
                    amount: 99900
                    currency: GBP
                  amountVat:
                    amount: 19980
                    currency: GBP
                  amountVatInclusive:
                    amount: 119880
                    currency: GBP
            invalidLineItem:
              summary: "invalid_line_item: VAT not within 1p of the rate"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: invalid_line_item
                detail: "quote.items[0]: vat must be within 1p of the rate on the discounted net, and 0 when exempt
                  or 0%"
            currencyMismatch:
              summary: "currency_mismatch: not GBP"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: currency_mismatch
                detail: Every amount must be in GBP.
            totalOutOfRange:
              summary: "total_out_of_range: nothing to finance"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: total_out_of_range
                detail: The total including VAT must be above zero and at most 1000000000 (£10,000,000.00).
            amountOutOfBounds:
              summary: "amount_out_of_bounds: outside every product's loan amounts"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: amount_out_of_bounds
                detail: The total including VAT is outside the amounts the available finance products cover.
            productUnavailable:
              summary: "product_unavailable: no finance product offered now"
              value:
                type: about:blank
                title: The quote is refused
                status: 422
                code: product_unavailable
                detail: No finance product is available for this quote at the moment.
            optionUnavailable:
              summary: An optionId that is not one of your options for this amount now (createApplication,
                issueHandoff)
              value:
                type: about:blank
                title: The finance option is unavailable
                status: 422
                code: product_unavailable
                detail: "optionId: not one of your finance options for this amount now; read listFinanceOptions
                  again"
          schema:
            $ref: "#/components/schemas/QuoteProblem"
    TooManyRequests:
      description: "rate_limited: too many requests in a short time. Nothing was done. Wait at least
        Retry-After seconds, then retry."
      headers:
        Retry-After:
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
            description: Whole seconds to wait before retrying.
            example: "1"
          required: true
          description: Whole seconds to wait before retrying.
      content:
        application/problem+json:
          examples:
            rateLimited:
              summary: Too many requests in a short time; wait for Retry-After
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: rate_limited
                detail: Too many requests. Wait for the time in Retry-After, then try again.
          schema:
            $ref: "#/components/schemas/RateLimitedProblem"
