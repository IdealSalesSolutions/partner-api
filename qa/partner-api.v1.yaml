    post:
      operationId: amendApplication
      security:
        - partnerApiKey:
            - applications:amend
      summary: Replace the Quote.
      description: "The quote sent replaces the Quote in force, whole. Allowed before signing: created, in
        progress, submitted or approved. From submitted or approved, an amend moves the application
        back to in_progress and withdraws any submission the lender holds, so the customer is asked
        again; that is not yet available and answers 501. From any other status, an amend is
        refused."
